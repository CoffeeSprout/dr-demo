apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Failover = swap these counts between primary and standby in one commit.
replicas:
  - name: echo
    count: 0
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: echo
      spec:
        template:
          spec:
            containers:
              - name: echo
                args:
                  - -listen=:5678
                  - -text=jupiter-wsdc1 (standby)
